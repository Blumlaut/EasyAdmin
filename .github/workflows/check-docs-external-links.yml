name: Check Docs External Links

# External links rot without anyone touching the repo, so this runs on a
# schedule instead of on every pull request (a slow network check that can fail
# for unrelated reasons should not block contributors). The fast internal link
# check lives in check-docs-links.yml and still runs on every docs change.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-external-links:
    name: Check for broken external links
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run external link checker
        run: python3 scripts/check-docs-links.py --external --retries 3
